[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qrc-pulsar-bench"
version = "1.0.0"
authors = [
  { name="Todd Hendrixx (H-XX-D)", email="todd@hendrixxdesign.com" },
]
description = "High-precision relational pulsar timing & multi-body benchmark suite grounded in Quantum Relational Causality (QRC)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.scripts]
qrc-bench = "qrc_pulsar_bench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

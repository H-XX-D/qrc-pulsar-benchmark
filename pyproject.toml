[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qrc-pulsar-bench"
version = "1.1.0"
authors = [
  { name="Todd Hendrixx (H-XX-D)", email="todd@hendrixxdesign.com" },
]
description = "Newtonian three-body dynamics, post-Keplerian formulas, and pulsar residual inspection"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
timing = ["pint-pulsar>=1.1", "astropy>=5"]
acceleration = ["numba>=0.57", "numpy<2.4"]

[project.scripts]
qrc-bench = "qrc_pulsar_bench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_data: regression checks using published residual files"]
